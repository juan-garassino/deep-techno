[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepTechno"
version = "0.2.0"
description = "Multi-modal MIDI generation: LSTM, Music Transformer, text-conditioned and vision-conditioned"
authors = [{name = "Juan Garassino", email = "juan.garassino@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pretty-midi>=0.2.10",
    "mido>=1.3.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
vision  = ["timm>=0.9.0"]
musegan = ["torch>=2.2.0"]  # MuseGAN subsystem (multi-track WGAN-GP)
dev     = ["pytest>=8.0", "ipython>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
